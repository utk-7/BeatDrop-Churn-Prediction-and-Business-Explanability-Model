name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Also install httpx since TestClient uses it in newer FastAPI/Starlette versions
          pip install httpx

      - name: Lint with ruff
        run: |
          ruff check src/ app/

      - name: Run tests with pytest
        run: |
          # Copy fixtures to the required paths so Pytest and Docker build can succeed in CI
          mkdir -p models data/processed
          cp tests/fixtures/xgboost_model_v0.2.0.joblib models/
          cp tests/fixtures/customer_features.parquet data/processed/
          pytest tests/ -v

      - name: Verify Docker Compose (End-to-End)
        run: |
          # Start containers in detached mode
          docker compose up -d --build
          
          # Wait for the backend to become healthy (since it loads ~971k rows into memory)
          echo "Waiting for backend to become healthy..."
          timeout 60s bash -c 'until curl -s http://localhost:8000/health | grep "\"status\":\"healthy\""; do sleep 5; done'
          
          # Verify frontend is serving files
          curl -s -f http://localhost:8080 > /dev/null
          echo "Frontend is reachable."
          
          # Verify backend is reachable and healthy
          curl -s -f http://localhost:8000/health
          echo "Backend is reachable."
          
          # Perform a real customer lookup request
          echo "Testing customer lookup..."
          # Use python to cleanly extract a single MSNO, url-encode it, and make the request
          python -c "
import urllib.request, json, urllib.parse;
sample_resp = urllib.request.urlopen('http://localhost:8000/customers/sample').read();
msno = json.loads(sample_resp)[0];
print(f'Using sample customer: {msno}');
msno_encoded = urllib.parse.quote(msno, safe='');
predict_resp = urllib.request.urlopen(f'http://localhost:8000/customers/{msno_encoded}/predict');
print('Customer lookup successful:', json.loads(predict_resp.read())['risk_tier'])"
          
          # Shutdown containers
          docker compose down
