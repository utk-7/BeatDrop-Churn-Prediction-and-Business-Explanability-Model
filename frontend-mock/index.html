<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatDrop - Cohort Dashboard</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2l-3 9h9l-3 4 8 5-12-8-12 8 8-5-3-4h9z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>BeatDrop</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active" data-page="home">Home</a></li>
        <li><a href="customer-lookup.html" data-page="customer-lookup">Customer Lookup</a></li>
        <li><a href="model-performance.html" data-page="model-performance">Model Performance</a></li>
        <li><a href="about.html" data-page="about">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Cohort Dashboard</h1>
      <p class="page-subtitle">Overview of customer health and churn risk metrics</p>
    </div>

    <div class="grid grid-4 mb-4" id="stat-cards">
      <!-- Stat cards populated by JS -->
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h3 class="card-title">Segment Filters</h3>
      </div>
      <div id="segment-filters"></div>
    </div>

    <div class="grid grid-auto mb-4">
      <div class="chart-wrapper">
        <div id="churn-drivers-chart"></div>
      </div>
      <div class="chart-wrapper">
        <div id="business-impact"></div>
      </div>
    </div>
  </div>

  <script src="./js/mock-data.js"></script>
  <script src="./js/main.js"></script>
  <script>
    // Initialize dashboard on page load
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof app !== 'undefined' && app.currentPage === 'home') {
        app.renderDashboard();
      }
    });
  </script>
</body>

</html>
