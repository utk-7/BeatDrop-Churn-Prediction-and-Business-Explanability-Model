version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s # Allows time for lifespan data loading

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
